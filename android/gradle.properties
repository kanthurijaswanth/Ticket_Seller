org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
org.gradle.workers.max=2
org.gradle.daemon=true
org.gradle.caching=true

# JDK used by Gradle. Points at the JDK bundled with Android Studio (JBR).
# If you build from Android Studio you can remove this line — the IDE sets its own.
# On another machine, change this to your local JDK 17+ path.
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr

android.useAndroidX=true
android.enableJetifier=true
